<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Andreza IA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h2>Criar Conta - Andreza IA</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Escolha um nome de usuário" required>
            <input type="password" name="password" placeholder="Crie uma senha" required>
            <button type="submit" class="auth-btn">Cadastrar</button>
        </form>
        <p class="auth-link">Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a></p>
    </div>
</body>
</html>
